<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Träna nationella prov – Matematik åk 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fbfcf7; --grid:rgba(59,134,198,.09);
  --ink:#1f2a44; --muted:#5b6478;
  --blue:#3b86c6; --blue-d:#22609a; --blue-l:#d7e6f3;
  --pencil:#f2c230; --ok:#2b8a55; --ok-l:#e2f3e8; --err:#c63d4c; --err-l:#fbe7e9;
}
*{box-sizing:border-box}
html{font-size:18px;-webkit-text-size-adjust:100%}
body{margin:0;font-family:Andika,"Trebuchet MS",system-ui,sans-serif;color:var(--ink);line-height:1.5;
  background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px}
a{color:var(--blue-d)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pencil);outline-offset:2px}

/* ---------- Omslaget (efterliknar provhäftet) ---------- */
.cover{max-width:980px;margin:0 auto;padding:16px 16px 0}
.band{position:relative;background:var(--blue);color:#fff;border-radius:0 30px 0 0;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;overflow:hidden;min-height:58px}
.band::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.3) 8px,transparent 9px);background-size:36px 36px;background-position:6px 4px;-webkit-mask-image:linear-gradient(90deg,#000 0,transparent 42%);mask-image:linear-gradient(90deg,#000 0,transparent 42%)}
.band a{white-space:nowrap;position:relative;color:#fff;text-decoration:none;font-weight:700;padding:4px 10px;border-radius:8px;background:rgba(255,255,255,.14)}
.band a:hover{background:rgba(255,255,255,.26)}
.band .kicker{position:relative;font-size:1.25rem}
.band .kicker b{font-weight:700}
.cbody{display:grid;grid-template-columns:1fr 160px;background:var(--blue-l);border-radius:0 0 30px 0;overflow:hidden}
.ctitle{padding:18px 22px 22px}
.ctitle h1{font-size:clamp(2.1rem,6vw,3.4rem);font-weight:400;margin:0;line-height:1.05}
.ctitle h2{font-size:clamp(1.3rem,3.4vw,1.8rem);margin:.5rem 0 0;line-height:1.2}
.ctitle p{margin:.25rem 0 0;color:var(--muted)}
.grade{background:var(--blue);color:#fff;display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;padding:10px 16px 0}
.grade small{font-weight:700;font-size:.95rem}
.grade b{font-weight:400;font-size:8rem;line-height:.85}

.wrap{max-width:980px;margin:0 auto;padding:22px 16px 140px}

/* ---------- Startsidan ---------- */
.tabs{display:inline-flex;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:4px;gap:4px;margin:4px 0 20px}
.tabs a{padding:8px 16px;border-radius:10px;text-decoration:none;color:var(--ink);font-weight:700}
.tabs a[aria-current="page"]{background:var(--ink);color:#fff}
.lead{max-width:60ch;margin:0 0 18px}
.dplist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.dp{display:flex;gap:14px;align-items:flex-start;background:#fff;border:2px solid #dfe5ee;border-radius:16px;padding:14px 16px;text-decoration:none;color:var(--ink)}
.dp:hover{border-color:var(--blue)}
.dot{flex:none;width:52px;height:52px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:1.6rem;font-weight:700}
.dp.mix .dot{background:var(--pencil);color:var(--ink)}
.dp b{display:block;font-size:1.1rem}
.dp small{display:block;color:var(--muted);font-size:.9rem;line-height:1.35;margin-top:2px}
.note{font-size:.9rem;color:var(--muted);max-width:65ch;margin-top:18px}

.oldtab{border-collapse:separate;border-spacing:6px;margin-left:-6px}
.oldtab th{text-align:left;font-weight:700;padding:0 8px 0 0;white-space:nowrap}
.oldtab thead th{text-align:center;color:var(--muted);font-size:.9rem}
.oldtab td{text-align:center;vertical-align:top}
.oldtab tbody th{vertical-align:top;padding-top:14px}
.pdf{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:12px;background:#fff;border:2px solid var(--blue);color:var(--blue-d);font-weight:700;font-size:1.2rem;text-decoration:none}
.pdf:hover{background:var(--blue);color:#fff}
.none{color:#b8bfcb}
.badge{display:inline-block;font-size:.72rem;font-weight:700;color:var(--muted);background:#eef1f5;border-radius:999px;padding:0 7px;margin-left:4px;vertical-align:middle;white-space:nowrap}
.badge.full{color:var(--ok);background:var(--ok-l)}
.oldtab td .badge{display:block;margin:3px auto 0;width:max-content}
.msgbox{padding:10px 14px;border-left:5px solid var(--err);background:var(--err-l);border-radius:0 10px 10px 0}
.imgmiss{padding:24px 16px;border:2px dashed var(--err);border-radius:12px;background:var(--err-l);text-align:center}

/* ---------- Provbladet ---------- */
.back{display:inline-block;margin-bottom:14px;font-weight:700;text-decoration:none}
.sheet{background:#fff;border:1px solid #dde3ec;box-shadow:0 2px 0 #dde3ec;max-width:820px;margin:0 auto;padding:34px 40px 28px}
.instr{font-style:italic;margin:0 0 18px}
.qs{list-style:none;margin:0;padding:0}
.q{display:grid;grid-template-columns:2.2em 1fr;padding:18px 0 22px;border-bottom:1px dashed #e0e5ed}
.q:last-child{border-bottom:0}
.qn{font-weight:700}
.sub{margin:.55rem 0;display:flex;flex-wrap:wrap;align-items:baseline;gap:.35rem .5rem}
.sub.row{justify-content:space-between}
.lbl{min-width:1.6em;flex:none}
.sc{flex:1 1 0;min-width:0}
.grow{flex:1 1 16em}
.svar{margin-top:.8rem;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.big{font-size:1.6rem;letter-spacing:.4em;margin:.4rem 0 .6rem}
.calc{font-size:1.35rem}
.fig{display:block;margin:.6rem 0;color:var(--ink);max-width:100%;height:auto}
.sheetfoot{margin-top:18px;font-size:.75rem;color:var(--muted);display:flex;justify-content:space-between}

input.ans{font:inherit;font-size:1.1rem;color:var(--blue-d);background:transparent;border:0;border-bottom:2px solid var(--ink);padding:2px 4px;text-align:center;border-radius:4px 4px 0 0;min-width:3ch;max-width:100%}
input.ans:focus{outline:none;background:#fff8dc;border-bottom-color:var(--pencil)}
.ok{background:var(--ok-l)!important;border-color:var(--ok)!important}
.bad{background:var(--err-l)!important;border-color:var(--err)!important}

.mc{display:inline-flex;flex-wrap:wrap;gap:8px;vertical-align:middle}
.mc.col{display:flex;flex-direction:column;align-items:flex-start}
.opt{background:#fff;border:2px solid transparent;border-radius:999px;padding:4px 14px;cursor:pointer;font-size:1.1rem;box-shadow:inset 0 0 0 1px #cfd6e2}
.opt:hover{box-shadow:inset 0 0 0 1px var(--blue)}
.opt.sel{border-color:var(--blue-d);border-radius:48% 52% 46% 54%/55% 45% 55% 45%;box-shadow:none}
.mc.col .opt{font-size:1.5rem;letter-spacing:.25em;padding:4px 18px}
.mc.ok .opt.sel{border-color:var(--ok);background:var(--ok-l)}
.mc.bad .opt.sel{border-color:var(--err);background:var(--err-l)}
.mc.ok,.mc.bad{background:none!important}

.facit{margin-top:.8rem;padding:8px 12px;border-left:4px solid var(--pencil);background:#fffbea;font-size:.95rem}
.facit pre{margin:.3rem 0 0;font-size:1.05rem;line-height:1.25}
.col{font-family:ui-monospace,Menlo,Consolas,monospace}
.calcgrid{border-collapse:collapse;font-family:ui-monospace,Menlo,Consolas,monospace;margin:.3rem 0}
.calcgrid td.dg{width:1.5em;height:auto;display:table-cell;text-align:center;font-size:1.35rem;padding:1px 2px;position:relative}
.calcgrid td.opcell{width:1.2em;text-align:left;font-size:1.35rem;vertical-align:bottom}
.calcgrid tr.mkrow td.dg{font-size:.75rem;color:var(--err);height:1.1em;vertical-align:bottom;padding-bottom:0}
.calcgrid tr.mkrow td.mk{font-weight:700}
.calcgrid tr.opline td{border-bottom:2px solid var(--ink);padding-bottom:2px}
.calcgrid tr.resrow td.dg{font-weight:700;padding-top:2px}
.calcgrid td.dg.struck{color:var(--err)}
.colpad{display:table;margin:.5rem 0 .2rem;padding:6px 12px 8px;border:2px solid transparent;border-radius:12px;background:#f7f9fc}
.colpad.ok{border-color:var(--ok);background:var(--ok-l)}
.colpad.bad{border-color:var(--err);background:var(--err-l)}
.calcgrid.live td.dg{width:2em;height:auto;padding:2px 3px}
.calcgrid.live tr.mkrow td.dg{height:auto;padding-bottom:1px}
.calcgrid.live input{font-family:inherit;text-align:center;background:#fff;color:var(--blue-d);border-radius:5px;padding:0}
.calcgrid.live .cin{width:1.6em;height:1.75em;font-size:1.35rem;font-weight:700;border:2px solid #aab4c3}
.calcgrid.live .cin:focus,.calcgrid.live .mkin:focus{outline:none;border-color:var(--pencil);background:#fff8dc}
.calcgrid.live .mkin{width:1.6em;height:1.4em;font-size:.85rem;color:var(--err);border:1.5px dashed #d9a3aa}
.calcgrid.live .cin.dok{border-color:var(--ok);background:var(--ok-l)}
.calcgrid.live .cin.dbad{border-color:var(--err);background:var(--err-l)}
.dgb{font:inherit;font-size:1.35rem;background:none;border:0;padding:0 .15em;cursor:pointer;position:relative;color:var(--ink);border-radius:4px}
.dgb:hover{background:#fff4c7}
.dgb.struck{color:var(--err)}
.dgb.struck::after{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid var(--err);transform:rotate(-12deg)}
.sm{font:inherit;font-size:.95rem;border:2px solid var(--ink);background:#fff;border-radius:10px;padding:4px 12px;font-weight:700;cursor:pointer}
.sm:hover{background:#fff8dc}
.padwrap{margin-top:.6rem}
.padwrap summary{cursor:pointer;display:inline-block;font-weight:700;font-size:.95rem;color:var(--blue-d);border:2px dashed #9fbadc;border-radius:10px;padding:3px 12px;list-style:none}
.padwrap summary::-webkit-details-marker{display:none}
.padwrap[open] summary{border-style:solid}
.padform{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:.5rem 0 .2rem}
.padform input,.padform select{font:inherit;font-size:1.05rem;border:2px solid var(--ink);border-radius:8px;padding:3px 6px;background:#fff}
.padrow{margin:.4rem 0 .6rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.padrow select{font:inherit;font-size:1.05rem;border:2px solid var(--ink);border-radius:8px;padding:3px 8px;background:#fff}
.calcpad{display:flex;align-items:center;gap:.4em;font-size:1.35rem;margin:.4rem 0;flex-wrap:wrap}
.calcpad input{font:inherit;font-size:1.35rem;text-align:center;border:2px solid var(--ink);border-radius:8px;padding:2px 4px;background:#fff;width:3.4em}
.calcpad .mA,.calcpad .mB,.fracin input{width:4.6em}
.calcpad input::placeholder{font-size:.6em;letter-spacing:0}
.calcpad .monoans{color:var(--blue-d)}
.calcpad input.dok{border-color:var(--ok);background:var(--ok-l)}
.calcpad input.dbad{border-color:var(--err);background:var(--err-l)}
.fracin{display:inline-flex;flex-direction:column;align-items:center;gap:0}
.fracin input{border-radius:8px 8px 0 0}
.fracin input+input{border-top:3px solid var(--ink);border-radius:0 0 8px 8px;margin-top:2px}
.padform input{width:4.6em;text-align:center}
.padmsg{font-size:.9rem;font-weight:700}
.padmsg.good{color:var(--ok)}
.padmsg.bad{color:var(--err)}
.calcgrid td.dg.struck::after{content:"";position:absolute;left:10%;right:10%;top:48%;border-top:2px solid var(--err);transform:rotate(-8deg)}


.cloud{display:inline-flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;max-width:260px;padding:18px 28px;margin:.5rem 0;background:#dcecf8;border:1.5px solid #2c3e5c;border-radius:48% 52% 45% 55%/60% 55% 45% 40%;font-size:1.05rem}
.cards{display:flex;gap:18px;margin:.6rem 0 .8rem;padding-left:.3rem}
.card{display:grid;place-items:center;width:46px;height:58px;background:#ffe600;border:1.5px solid #333;font-size:1.6rem;transform:rotate(var(--r,0deg))}
.box{display:table;border:2px solid var(--blue);border-radius:6px;padding:10px 16px;margin:.5rem 0}
.box div{margin:.2rem 0}
.sym{letter-spacing:.5em;font-size:1.1rem;display:inline-block;min-width:6.5em;border:1px solid #999;padding:2px 10px;margin-right:.6rem}
.eq{font-size:1.5rem;line-height:1.9}
.e{font-size:1.8rem;vertical-align:middle;line-height:1}
.eq .e{font-size:2rem}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.15;margin:0 .15em}
.frac>span:first-child{border-bottom:2px solid currentColor;padding:0 .2em}
table.t{border-collapse:collapse;margin:.6rem 0}
table.t th,table.t td{border:1px solid #555;padding:5px 12px;text-align:left}
table.t th{background:#e4e7eb}
table.t td.c{text-align:center}
.cal{border-collapse:collapse;margin:.6rem 0;font-size:.95rem}
.cal caption{background:#d7262c;color:#fff;font-weight:700;padding:4px}
.cal th,.cal td{border:1px solid #aaa;width:2.8em;height:2.2em;text-align:center}
.colors{display:flex;flex-wrap:wrap;gap:4px;margin:.6rem 0}
.cc{width:70px;height:54px;display:grid;place-items:center;border:1.5px solid #333;font-weight:700;font-size:.9rem;color:#fff}
.cc.blank{background:#fff}
.cc.blank input{width:62px!important;font-size:.9rem}

/* ---------- Gamla prov ---------- */
.pg{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:start;margin-bottom:28px}
.pg img{width:100%;height:auto;display:block;background:#fff;border:1px solid #dde3ec;box-shadow:0 2px 0 #dde3ec;position:sticky;top:12px}
.ansbox{background:#fff;border:2px solid var(--ink);border-radius:16px;padding:14px 18px}
.ansbox h3{margin:0 0 4px;font-size:1rem;color:var(--muted)}
.ansbox .q{padding:12px 0 14px}
select.sel{font:inherit;font-size:1.2rem;min-width:2.8em;height:2.1em;border:2px solid var(--ink);border-radius:6px;background:#fff;color:var(--blue-d);text-align:center;padding:0 4px}
.selfnote{font-size:.85rem;color:var(--muted);border:1.5px dashed #b9c1ce;border-radius:8px;padding:2px 8px}
.arrowbox{display:inline-grid;place-items:center;width:2em;height:2em;border:1.5px solid #555;font-size:1.1rem}
.mc.multi .opt.sel{border-radius:10px}
@media (max-width:760px){.pg{grid-template-columns:1fr}.pg img{position:static}}

/* ---------- Knappraden ---------- */
.actions{position:fixed;left:0;right:0;bottom:0;background:rgba(251,252,247,.96);border-top:2px solid var(--ink);padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:5}
.actions .in{max-width:820px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:2px solid var(--ink);background:#fff;border-radius:12px;padding:9px 16px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--ink);color:#fff}
.btn:hover{background:#fff8dc}
.btn.primary:hover{background:var(--blue-d)}
.result{flex:1 1 100%;font-weight:700;font-size:1.05rem}
.result:empty{display:none}
.spacer{flex:1}

@media (max-width:620px){
  html{font-size:17px}
  .cbody{grid-template-columns:1fr 96px}
  .grade b{font-size:5.4rem}
  .band .kicker{font-size:1rem}
  .sheet{padding:22px 16px 18px;border-left:0;border-right:0}
  .wrap{padding-left:8px;padding-right:8px}
  .q{grid-template-columns:1.8em 1fr}
  .btn{padding:7px 10px;font-size:.9rem;border-radius:10px}
  #bPrint,.spacer{display:none}
  .actions .in{flex-wrap:nowrap;gap:6px}
  .actions .in{flex-wrap:wrap}
  .result{font-size:.9rem}
  .band{padding:10px 12px}
  .band a{font-size:.85rem}
  .oldtab{border-spacing:4px}
  .pdf{width:40px;height:40px;font-size:1rem;border-radius:10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  body{background:#fff}
  .band a,.tabs,.back,.actions,.note{display:none!important}
  .wrap{padding:0}
  .sheet{border:0;box-shadow:none;padding:0;max-width:none}
  .q{break-inside:avoid}
  input.ans{background:none!important}
  .ok,.bad{background:none!important;border-color:var(--ink)!important}
}
</style>
</head>
<body>

<header class="cover">
  <div class="band">
    <span class="kicker"><b>Nationellt prov</b>, övning</span>
    <a href="../">Matte-Portalen</a>
  </div>
  <div class="cbody">
    <div class="ctitle">
      <h1>Matematik</h1>
      <h2 id="h2">Träna inför provet</h2>
      <p id="hp">Nya uppgifter varje gång, i samma stil som det riktiga provet.</p>
    </div>
    <div class="grade"><small>Årskurs</small><b>3</b></div>
  </div>
</header>

<main class="wrap" id="app"></main>
<div class="actions" id="actions" hidden><div class="in">
  <div class="result" id="result" aria-live="polite"></div>
  <button class="btn primary" id="bCheck">Rätta</button>
  <button class="btn" id="bNew">Nya uppgifter</button>
  <span class="spacer"></span>
  <button class="btn" id="bFacit">Visa facit</button>
  <button class="btn" id="bPrint">Skriv ut</button>
</div></div>

<script>
// ===================== LOGIC START =====================
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const P=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const until=(fn,ok)=>{let v,n=0;do{v=fn();n++}while(!ok(v)&&n<5000);return v};
const L="abcdefgh";
const norm=s=>String(s==null?"":s).trim().toLowerCase().replace(/\s+/g," ");
const toNum=v=>{const d=String(v==null?"":v).replace(/[^0-9]/g,"");return d===""?NaN:parseInt(d,10)};
const toTime=v=>{const t=String(v==null?"":v).trim();if(/^\d{1,2}$/.test(t)&&+t<=24)return (+t*60)%720;const m=t.match(/^(\d{1,2})\s*[.:,]?\s*(\d{2})$/);if(!m)return NaN;const h=+m[1],mi=+m[2];if(mi>59)return NaN;return (h*60+mi)%720};
const fmtT=(h,m)=>`${String(h).padStart(2,"0")}.${String(m).padStart(2,"0")}`;
const frac=(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const svar=x=>`<div class="svar">Svar: ${x}</div>`;
const sub=(i,x)=>`<div class="sub"><span class="lbl">${L[i]})</span><span class="sc">${x}</span></div>`;
const it=s=>`<i>${s}</i>`;
const GOR=it("Gör en beräkning och skriv svar.");
const VISA=it("Visa hur du löser uppgiften och skriv svar.");

// fält
const N=(a,w)=>({k:"num",a,w:w||Math.max(3,String(a).length+1)});
const T=(a,w)=>({k:"txt",a:[].concat(a).map(norm),w:w||8});
const TM=(mins)=>({k:"time",a:((mins%1440)+1440)%720,w:5});
const MC=(opts,a,layout)=>({k:"mc",opts,a,layout});
const FREE=(w,num=true)=>({k:"free",w:w||3,num});
const COL=(x,y,op)=>({k:"col",a:op==="+"?x+y:x-y,x,y,op});

function checkField(fd,v){
  if(fd.k==="num")return toNum(v)===fd.a;
  if(fd.k==="txt")return fd.a.includes(norm(v));
  if(fd.k==="time")return toTime(v)===fd.a;
  if(fd.k==="mc"||fd.k==="sel")return v===fd.a;
  if(fd.k==="col")return /^\d+$/.test(String(v||""))&&parseInt(v,10)===fd.a;
  if(fd.k==="multi")return Array.isArray(v)&&v.length===fd.a.length&&fd.a.every(i=>v.includes(i));
  if(fd.k==="self")return true;
  return false;
}
function build(gen){const fields=[];const f=s=>{fields.push(s);return `@@${fields.length-1}@@`};const q=gen(f);q.fields=fields;return q}
function gradeQ(q,vals){
  const r=q.check?(q.check(vals)||[]):[];
  return q.fields.map((fd,i)=>r[i]!==undefined?!!r[i]:checkField(fd,vals[i]));
}

const PEOPLE=[["Nova","hon"],["Troj","han"],["Amir","han"],["Sara","hon"],["Hanna","hon"],["Victor","han"],["Fatima","hon"],["Leo","han"],["Melvin","han"],["Karim","han"],["Lisa","hon"],["Olle","han"],["Jelena","hon"],["Ahmed","han"],["Alice","hon"],["Elias","han"],["Maja","hon"],["Noah","han"]];
const people=n=>shuf(PEOPLE).slice(0,n).map(([n,p])=>({n,p,P:p==="hon"?"Hon":"Han"}));

// ---------- bilder (SVG) ----------
function nline({min,max,ticks,labels,arrow}){
  const W=480,x=v=>24+(v-min)/(max-min)*420;
  let s=`<svg class="fig" viewBox="0 0 ${W} 92" width="${W}" role="img" aria-label="Tallinje">`;
  s+=`<line x1="10" y1="30" x2="464" y2="30" stroke="currentColor" stroke-width="2"/><path d="M464 24 L477 30 L464 36Z" fill="currentColor"/>`;
  ticks.forEach(v=>{const lb=labels.includes(v);s+=`<line x1="${x(v)}" y1="${lb?19:24}" x2="${x(v)}" y2="${lb?41:36}" stroke="currentColor" stroke-width="${lb?2:1.4}"/>`});
  labels.forEach(v=>s+=`<text x="${x(v)}" y="62" text-anchor="middle" font-size="17" fill="currentColor">${v}</text>`);
  if(arrow!=null){const X=x(arrow);s+=`<line x1="${X}" y1="88" x2="${X}" y2="42" stroke="#22609a" stroke-width="2.5"/><path d="M${X-6} 51 L${X} 41 L${X+6} 51" fill="none" stroke="#22609a" stroke-width="2.5"/>`}
  return s+"</svg>";
}
function tally(n){
  let s="",x=5;const g=Math.floor(n/5),r=n%5;
  for(let i=0;i<g;i++){for(let j=0;j<4;j++)s+=`<line x1="${x+j*6}" y1="4" x2="${x+j*6}" y2="22"/>`;s+=`<line x1="${x-4}" y1="19" x2="${x+22}" y2="7"/>`;x+=34}
  for(let j=0;j<r;j++)s+=`<line x1="${x+j*6}" y1="4" x2="${x+j*6}" y2="22"/>`;
  const w=x+r*6+4;
  return `<svg viewBox="0 0 ${w} 26" width="${w}" height="26" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-label="${n}">${s}</svg>`;
}
function poly(n,r,rot){const p=[];for(let i=0;i<n;i++){const a=rot+i*2*Math.PI/n;p.push(`${(60+r*Math.cos(a)).toFixed(1)},${(60+r*Math.sin(a)).toFixed(1)}`)}return p.join(" ")}
function shapeSVG(name){
  const rot=Math.random()*Math.PI;let inner;
  if(name==="cirkel")inner=`<circle cx="60" cy="60" r="42"/>`;
  else if(name==="triangel"){const p=[[R(12,40),R(88,106)],[R(80,108),R(75,106)],[R(35,95),R(10,28)]];inner=`<polygon points="${p.map(q=>q.join(",")).join(" ")}"/>`}
  else if(name==="kvadrat")inner=`<polygon points="${poly(4,46,rot)}"/>`;
  else if(name==="rektangel"){const w=R(78,100),h=R(34,46);inner=`<rect x="${60-w/2}" y="${60-h/2}" width="${w}" height="${h}" transform="rotate(${R(-35,35)} 60 60)"/>`}
  else if(name==="femhörning")inner=`<polygon points="${poly(5,46,rot)}"/>`;
  else inner=`<polygon points="${poly(6,46,rot)}"/>`;
  return `<svg viewBox="0 0 120 120" width="104" height="104" fill="#8cc152" stroke="#2d4a1a" stroke-width="1.5" aria-hidden="true">${inner}</svg>`;
}
function clockSVG(h,m){
  const ma=m/60*2*Math.PI,ha=((h%12)+m/60)/12*2*Math.PI;
  const hand=(a,l,w)=>`<line x1="60" y1="60" x2="${(60+l*Math.sin(a)).toFixed(1)}" y2="${(60-l*Math.cos(a)).toFixed(1)}" stroke="#1f2a44" stroke-width="${w}" stroke-linecap="round"/>`;
  let s=`<svg class="fig" viewBox="0 0 120 120" width="160" height="160" aria-label="Klocka"><circle cx="60" cy="60" r="55" fill="#f7e36e" stroke="#1f2a44" stroke-width="3"/>`;
  for(let i=0;i<60;i++){const a=i/60*2*Math.PI,r1=i%5?51:48;s+=`<line x1="${(60+r1*Math.sin(a)).toFixed(1)}" y1="${(60-r1*Math.cos(a)).toFixed(1)}" x2="${(60+54*Math.sin(a)).toFixed(1)}" y2="${(60-54*Math.cos(a)).toFixed(1)}" stroke="#1f2a44" stroke-width="${i%5?.8:1.6}"/>`}
  for(let i=1;i<=12;i++){const a=i/12*2*Math.PI;s+=`<text x="${(60+40*Math.sin(a)).toFixed(1)}" y="${(60-40*Math.cos(a)+4.5).toFixed(1)}" text-anchor="middle" font-size="13" fill="#1f2a44">${i}</text>`}
  return s+hand(ha,26,4.5)+hand(ma,41,2.6)+`<circle cx="60" cy="60" r="3.5" fill="#1f2a44"/></svg>`;
}
function stones(n){
  let s="";for(let i=0;i<n;i++){const x=12+(i%3)*26,y=12+Math.floor(i/3)*20;s+=`<ellipse cx="${x}" cy="${y}" rx="11" ry="8" fill="#b7aea0" stroke="#4a4540" stroke-width="1.3" transform="rotate(-18 ${x} ${y})"/>`}
  const h=Math.max(1,Math.ceil(n/3))*20+4;
  return n?`<svg viewBox="0 0 80 ${h}" width="80" height="${h}" aria-label="${n} stenar">${s}</svg>`:"";
}

  const box=codes.map((c,i)=>`<div><span class="sym">${sp(c)}</span> betyder <b>${i===hideIdx?"?":letters[i]}</b></div>`).join("");
  const wordCodes=wl.map(L=>sp(codes[letters.indexOf(L)])).map(c=>`<span class="sym">${c}</span>`).join("");
  const encL=P(wl),corr=letters.indexOf(encL);
  const distIdx=shuf([0,1,2,3,4].filter(i=>i!==corr&&i!==hideIdx)).slice(0,3);
  const o2=shuf([corr,...distIdx]);
  return{html:`${p.n} och ${q.n} har hittat på ett hemligt språk med symboler i stället för bokstäver. En av bokstäverna är bortsuddad.<div class="box">${box}</div>

    ${sub(0,`Vilken bokstav är bortsuddad? ${it("Titta på vilka bokstäver som redan är använda.")}`)}<div style="padding-left:2em">${f(T(letters[hideIdx],2))}</div>

const EMO=[["🐟","🐭","🐱"],["🍎","🥕","🍌"],["🐸","🐞","🐢"],["🐰","🦜","🐶"],["⭐","🌙","🍄"]];
function gPics(f){
  const e=P(EMO),S=x=>`<span class="e">${x}</span>`;
  let eqs,vals;
  if(Math.random()<.5){const a=R(2,6),b=R(3,9),c=R(4,12);vals=[a,b,c];eqs=[`${S(e[0])} + ${S(e[0])} = ${2*a}`,`${S(e[1])} + ${S(e[0])} = ${a+b}`,`${S(e[2])} + ${S(e[0])} = ${a+c}`]}
  else{const a=R(4,8),k=R(1,a-1),b=a-k;vals=[a,b,a+b];eqs=[`${S(e[0])} = ${S(e[1])} + ${k}`,`${2*a} = ${S(e[0])} + ${S(e[0])}`,`${S(e[2])} = ${S(e[1])} + ${S(e[0])}`]}
  return{html:`<div class="box eq">${eqs.map(x=>`<div>${x}</div>`).join("")}</div><br>Vad är varje sak värd?${e.map((x,i)=>sub(i,`${S(x)} = ${f(N(vals[i]))}`)).join("")}`,
    facit:e.map((x,i)=>`${x} = ${vals[i]}`).join("&nbsp;&nbsp; ")};
}
function gMental(f){
  const h1=R(1,5),h2=R(1,9-h1),a=R(11,17),b=until(()=>R(3,9),b=>a%10+b>=10),c=R(5,9),d=R(5,9),m1=R(2,5),m2=R(3,9),dv=P([2,3,4]),dq=R(3,9);
  const parts=[[`${h1*100} + ${h2*100} = ${f(N(100*(h1+h2),5))}`,100*(h1+h2)],[`${a} + ${b} = ${f(N(a+b))}`,a+b],[`${f(N(c+d))} = ${c} + ${d}`,c+d],[`${m1} · ${m2} = ${f(N(m1*m2))}`,m1*m2],[`${frac(dv*dq,dv)} = ${f(N(dq))}`,dq],null];
  const x=100+R(1,5);parts[5]=[`${x} − 99 = ${f(N(x-99))}`,x-99];
  return{html:`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 16px">${parts.map((p,i)=>sub(i,p[0])).join("")}</div>`,
    facit:parts.map((p,i)=>`${L[i]}) ${p[1]}`).join("&nbsp;&nbsp; ")};
}
function gMissing(f){
  const a=R(11,18),b=R(6,9),c=R(5,9),d=R(1,10-c),e=R(2,c+d-1),g=R(12,19),k=R(5,9),h=R(9,15),j=R(3,7);
  const parts=[[`${a} = ${f(N(a-b))} + ${b}`,a-b],[`${c} + ${d} = ${f(N(c+d-e))} + ${e}`,c+d-e],[`${g} − ${f(N(g-10))} = 10`,g-10],[`${h} = ${f(N(h+j))} − ${j}`,h+j]];
  return{html:`Skriv talet som saknas.<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 16px">${parts.map((p,i)=>sub(i,p[0])).join("")}</div>`,
    facit:parts.map((p,i)=>`${L[i]}) ${p[1]}`).join("&nbsp;&nbsp; ")};
}
const COLS={"Röd":"#d9443b","Blå":"#3b6fc4","Gul":"#f2c230","Svart":"#222","Grön":"#3c9a50"};
function gColors(f){
  const len=R(3,4),pat=shuf(Object.keys(COLS)).slice(0,len),n=len*3;
  const blanks=shuf([...Array(n).keys()].slice(len)).slice(0,R(3,4));

  const missing=[];
  for(let i=0;i<n;i++){const c=pat[i%len];if(blanks.includes(i)){html+=`<div class="cc blank">${f(T(c,6))}</div>`;missing.push(c)}else html+=`<div class="cc" style="background:${COLS[c]};color:${c==="Gul"?"#222":"#fff"}">${c}</div>`}
  return{html:html+"</div>",facit:`Mönstret är ${pat.join(", ")} om och om igen.`};
}
const MONTHS=["januari","februari","mars","april","maj","juni","juli","augusti","september","oktober","november","december"];
const DAYS=["måndag","tisdag","onsdag","torsdag","fredag","lördag","söndag"];
function gCalendar(f){
  const y=R(2026,2028),mo=R(0,11),first=(new Date(y,mo,1).getDay()+6)%7,len=new Date(y,mo+1,0).getDate();
  let t=`<table class="cal"><caption>${MONTHS[mo][0].toUpperCase()+MONTHS[mo].slice(1)} ${y}</caption><tr>${["Mån","Tis","Ons","Tors","Fre","Lör","Sön"].map(d=>`<th>${d}</th>`).join("")}</tr><tr>`;
  for(let i=0;i<first;i++)t+="<td></td>";
  for(let d=1;d<=len;d++){t+=`<td>${d}</td>`;if((first+d-1)%7===6&&d<len)t+="</tr><tr>"}
  t+="</tr></table>";
  const dd=R(2,len),wd=(first+dd-1)%7,tgt=R(0,6),firstT=((tgt-first+7)%7)+1;
  let cnt=0;for(let d=1;d<=len;d++)if((first+d-1)%7===tgt)cnt++;
  const tgt2=until(()=>R(0,6),x=>x!==tgt);let cnt2=0;for(let d=1;d<=len;d++)if((first+d-1)%7===tgt2)cnt2++;
  return{html:`Titta i kalendern.${t}${sub(0,`Vilken veckodag är den ${dd} ${MONTHS[mo]}?<br>${f(MC(DAYS,wd))}`)}${sub(1,`Vilket datum är den första ${DAYS[tgt]}en i ${MONTHS[mo]}? ${f(N(firstT))}`)}${sub(2,`Hur många ${DAYS[tgt2]}ar finns det i ${MONTHS[mo]}? ${f(N(cnt2))}`)}`,
    facit:`a) ${DAYS[wd]}&nbsp;&nbsp; b) den ${firstT}&nbsp;&nbsp; c) ${cnt2}`};
}

const DELPROV={
  B:{name:"Tal och mönster",desc:"Storleksordning, hundratal, tiotal och ental, tallinjen, sifferkort och tabeller.",instr:"",gens:()=>[bOrder,bPlace,bLine,bCards,bPattern,bEq,bTally]},

function colWidget(x,y,op,attrs){

const PAD=`<details class="padwrap"><summary>Välj räknesätt</summary><div class="padrow"><label>Räknesätt: <select class="pop" aria-label="Räknesätt"><option value="+">+</option><option value="-">−</option><option value="×">×</option><option value="÷">÷</option></select></label></div><div class="padbody"></div></details>`;
function wantPad(q,key){

  return `<li class="q" id="q${qi}"><span class="qn">${num}.</span><div>${body}${wantPad(q,key)?PAD:""}<div class="facit" hidden>${q.facit}</div></div></li>`;

function fieldHTML(q,qi,fi){

  return `<input class="ans" data-q="${qi}" data-f="${fi}" ${im} autocomplete="off" spellcheck="false" style="width:${fd.w+2}ch" aria-label="Svar">`;

// Äldre versioner av gamla.js har en vanlig svarsrad på skriftlig räkning. Gör om den till uppställning.
function upgradeCalc(q,key){
  if(!/-F$/.test(key)||q.check||q.fields.length!==1||q.fields[0].k!=="num")return q;
  const m=q.html.match(/(\d+)\s*([+−-])\s*(\d+)\s*=\s*@@0@@/);if(!m)return q;
  const x=+m[1],y=+m[3],op=m[2]==="+"?"+":"-",r=op==="+"?x+y:x-y;if(r!==q.fields[0].a)return q;
  q.fields[0]=COL(x,y,op);q.html=q.html.replace(m[0],`${x} ${op==="+"?"+":"−"} ${y} =</span></div><div>@@0@@`);
  if(!/calcgrid/.test(q.facit))q.facit=colFormHTML(x,y,op==="+"?"+":"−",r);
  return q;
}

function readCol(cp){

function readVal(qi,fi){

  const el=app.querySelector(`input[data-q="${qi}"][data-f="${fi}"]`);return el?el.value:"";
}
function grade(){

  });

app.addEventListener("click",e=>{
  const dgb=e.target.closest(".dgb");if(dgb){dgb.classList.toggle("struck");if(dgb.classList.contains("struck")){const td=dgb.closest("td"),idx=[...td.parentElement.children].indexOf(td);const mk=td.closest("table").querySelector(".mkrow").children[idx].querySelector("input");if(mk&&!mk.value)mk.focus()}return}

  const pc=e.target.closest(".padchk");if(pc){checkPad(pc.closest(".padwrap"));return}
  const pc2=e.target.closest(".padchk2");if(pc2){checkCalc(pc2.closest(".padbody").querySelector(".calcpad"));return}
  const b=e.target.closest(".opt");if(!b)return;const g=b.parentElement;
  if(!g.classList.contains("multi"))g.querySelectorAll(".opt").forEach(o=>o!==b&&o.classList.remove("sel"));b.classList.toggle("sel");g.classList.remove("ok","bad");
});
app.addEventListener("toggle",e=>{
  const w=e.target;if(!w.classList||!w.classList.contains("padwrap")||!w.open)return;
  if(!w.dataset.init){w.dataset.init="1";renderPad(w)}
},true);
app.addEventListener("change",e=>{
  if(e.target.classList.contains("pop")&&e.target.closest(".padwrap"))renderPad(e.target.closest(".padwrap"));
});
app.addEventListener("input",e=>{
  const t=e.target;
  if(t.classList.contains("ans"))t.classList.remove("ok","bad");
  if(t.classList.contains("cin")||t.classList.contains("mkin")){
    t.value=t.value.replace(/[^0-9]/g,"");const cp=t.closest(".colpad");if(cp){cp.classList.remove("ok","bad");cp.querySelectorAll(".cin").forEach(c=>c.classList.remove("dok","dbad"))}
    if(t.classList.contains("cin")&&t.value){const row=[...t.closest("tr").querySelectorAll(".cin")],i=row.indexOf(t);if(i>0)row[i-1].focus()}
  }
  if(t.classList.contains("monoans")){t.value=t.value.replace(/[^0-9]/g,"");t.classList.remove("dok","dbad");const cp=t.closest(".colpad");if(cp)cp.classList.remove("ok","bad")}
  if(t.classList.contains("mA")||t.classList.contains("mB")||t.classList.contains("dA")||t.classList.contains("dB")){t.value=t.value.replace(/[^0-9]/g,"");const cp=t.closest(".calcpad");if(cp){cp.querySelector(".monoans").classList.remove("dok","dbad")}}
});
function pmRow(op){
  return `<div class="padform"><input class="pa" inputmode="numeric" aria-label="Första talet" placeholder="tal"><span class="opsign">${op==="+"?"+":"−"}</span><input class="pb" inputmode="numeric" aria-label="Andra talet" placeholder="tal"><button type="button" class="sm padgo">Ställ upp</button></div><div class="padarea"></div>`;
}
function mulRow(){
  return `<div class="calcpad"><input class="mA" inputmode="numeric" maxlength="4" aria-label="Faktor" placeholder="faktor"><span>·</span><input class="mB" inputmode="numeric" maxlength="4" aria-label="Faktor" placeholder="faktor"><span>=</span><input class="monoans" inputmode="numeric" maxlength="6" aria-label="Svar"></div><div><button type="button" class="sm padchk2">Kolla uträkningen</button> <span class="padmsg"></span></div>`;
}
function divRow(){
  return `<div class="calcpad"><span class="fracin"><input class="dA" inputmode="numeric" maxlength="4" aria-label="Täljare" placeholder="täljare"><input class="dB" inputmode="numeric" maxlength="4" aria-label="Nämnare" placeholder="nämnare"></span><span>=</span><input class="monoans" inputmode="numeric" maxlength="6" aria-label="Svar"></div><div><button type="button" class="sm padchk2">Kolla uträkningen</button> <span class="padmsg"></span></div>`;
}
function renderPad(details){
  const op=details.querySelector(".pop").value,body=details.querySelector(".padbody");
  body.innerHTML=op==="×"?mulRow():op==="÷"?divRow():pmRow(op);
}
function makePad(w){
  const a=parseInt(w.querySelector(".pa").value),b=parseInt(w.querySelector(".pb").value),op=w.querySelector(".pop").value,area=w.querySelector(".padarea");
  if(isNaN(a)||isNaN(b)||a<0||b<0||a>9999||b>9999){area.innerHTML=`<p class="padmsg bad">Skriv två tal först.</p>`;return}
  if(op==="-"&&b>a){area.innerHTML=`<p class="padmsg bad">Vid minus ska det första talet vara störst.</p>`;return}
  area.innerHTML=colWidget(a,b,op,`data-pa="${a}" data-pb="${b}" data-pop="${op}"`)+`<div><button type="button" class="sm padchk">Kolla uträkningen</button> <span class="padmsg"></span></div>`;
  const c=area.querySelectorAll(".cin");if(c.length)c[c.length-1].focus();
}
function checkCalc(cp){
  const details=cp.closest(".padwrap"),msg=details.querySelector(".padmsg"),ans=cp.querySelector(".monoans");
  ans.classList.remove("dok","dbad");
  const isDiv=!!cp.querySelector(".dA");
  const a=parseInt((isDiv?cp.querySelector(".dA"):cp.querySelector(".mA")).value,10);
  const b=parseInt((isDiv?cp.querySelector(".dB"):cp.querySelector(".mB")).value,10);
  if(isNaN(a)||isNaN(b)||a<0||b<0){msg.textContent="Skriv två tal först.";msg.className="padmsg bad";return}
  if(isDiv&&b===0){msg.textContent="Det går inte att dela med 0.";msg.className="padmsg bad";return}
  const got=parseInt(ans.value,10);
  if(!isDiv){
    const r=a*b,ok=got===r;ans.classList.add(ok?"dok":"dbad");
    msg.textContent=ok?`Rätt räknat! ${a} · ${b} = ${r}. Skriv svaret på svarsraden.`:"Titta en gång till. Räkna hoppvis eller rita grupper om det är svårt.";
    msg.className="padmsg "+(ok?"good":"bad");return
  }
  const q=Math.floor(a/b),rest=a-q*b,ok=got===q;ans.classList.add(ok?"dok":"dbad");
  msg.textContent=ok?(rest?`Rätt räknat! ${a} ÷ ${b} = ${q} rest ${rest}. Skriv svaret på svarsraden.`:`Rätt räknat! ${a} ÷ ${b} = ${q}. Skriv svaret på svarsraden.`):"Titta en gång till. Hur många gånger får talet nedanför plats i talet ovanför?";
  msg.className="padmsg "+(ok?"good":"bad");
}
function checkPad(w){
  const cp=w.querySelector(".colpad");if(!cp)return;
  const a=+cp.dataset.pa,b=+cp.dataset.pb,op=cp.dataset.pop;
  const r=op==="+"?a+b:a-b,cins=[...cp.querySelectorAll(".cin")];
  const exp=String(r).padStart(cins.length," ").split("");let ok=true;
  cins.forEach((c,i)=>{c.classList.remove("dok","dbad");const want=exp[i]===" "?"":exp[i],got=c.value.trim();
    if(want===""&&got==="")return;if(got===want)c.classList.add("dok");else{c.classList.add("dbad");ok=false}});
  const m=w.querySelector(".padmsg");m.textContent=ok?`Rätt räknat! ${a} ${op==="+"?"+":"−"} ${b} = ${r}. Skriv svaret på svarsraden.`:"Titta på de röda rutorna och räkna en gång till.";m.className="padmsg "+(ok?"good":"bad");
}
app.addEventListener("change",e=>{if(e.target.classList.contains("sel"))e.target.classList.remove("ok","bad")});
app.addEventListener("keydown",e=>{
  const t=e.target;
  if(t.classList.contains("cin")&&e.key==="Backspace"&&!t.value){const row=[...t.closest("tr").querySelectorAll(".cin")],i=row.indexOf(t);if(i<row.length-1){e.preventDefault();row[i+1].focus();row[i+1].value=""}return}
  if(e.key!=="Enter"||!e.target.classList.contains("ans"))return;e.preventDefault();
  const all=[...app.querySelectorAll("input.ans")],i=all.indexOf(e.target);if(all[i+1])all[i+1].focus();else grade();
});
$("#bCheck").onclick=grade;
function hasAnswers(){return [...app.querySelectorAll("input.ans,input.cin,input.mkin")].some(i=>i.value.trim())||!!app.querySelector(".opt.sel,.dgb.struck")||[...app.querySelectorAll("select.sel")].some(s=>s.value!=="")}
$("#bNew").onclick=()=>{if(hasAnswers()&&!confirm(cur.exam?"Vill du börja om? Dina svar försvinner.":"Vill du få nya uppgifter? Dina svar försvinner."))return;cur.exam?examView(cur.key):practice(cur.key);window.scrollTo({top:0})};
$("#bFacit").onclick=()=>{cur.facit=!cur.facit;app.querySelectorAll(".facit").forEach(x=>x.hidden=!cur.facit);$("#bFacit").textContent=cur.facit?"Dölj facit":"Visa facit"};
$("#bPrint").onclick=()=>cur&&cur.exam?window.open(`prov/${cur.key}.pdf`,"_blank"):window.print();

function route(){
  const [a,b]=location.hash.replace(/^#\/?/,"").split("/");
  if(a==="ova"&&DELPROV[b])practice(b);else if(a==="prov"&&HAS_EXAMS()&&EXAMS[b])examView(b);else home(a==="prov"?"prov":"ova");
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);route();
}
</script>
</body>
</html>
